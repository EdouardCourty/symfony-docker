[global]

error_log = /var/log/php-fpm.error.log
daemonize = no

[www]

; if we send this to /proc/self/fd/1, it never appears
access.log = /var/log/php-fpm.access.log

user = www-data
group = www-data

listen = [::]:9000

pm = dynamic
pm.max_children = 30
pm.start_servers = 5
pm.min_spare_servers = 3
pm.max_spare_servers = 10

clear_env = no
